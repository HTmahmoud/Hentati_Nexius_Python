
version: '3.8'

services:
  currency-converter-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: currency-converter-dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3000
      - NODE_ENV=development
    stdin_open: true # Pour le mode interactif
    tty: true # Pour les logs en couleur
